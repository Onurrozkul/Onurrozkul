
name: Update profile art

# Refresh contribution graph and stats daily.
on:
  schedule:
    - cron: "17 6 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      -
      - name: Fetch GitHub contributions
        env:
          GH_PROFILE_USER: Onurrozkul
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scripts/fetch_contributions.py

      - name: Render contribution heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Render statistics card
        run: python scripts/render_stats_svg.py

      - name: Commit updated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg stats.svg"
